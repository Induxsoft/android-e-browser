<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Browser</title>
</head>
<body>
<!--========== STYLES ==========-->
<style>
        :root{ --primary-color: #CC0000; --secondary-color: #F5F4F8; --medium-gray:#888; }
        * { font-size: .8rem; box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif }
        select, input, button { font-size: 1.2rem; color: #000;border-radius: 5px; background-color: transparent;}
        #container { background-color: #FFF; width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: center; }
        #input-control-browser { width: 100%;display: flex; align-items: center; gap: 4px; border-radius: 5px; padding: 4px;}
        #navigate-btn-browser { cursor: pointer; padding: 4px 8px; margin: 2px; background-color: #FFF; }
        #url-browser, #protocol-select-browser { padding: 4px 0; }
        #url-browser { width: 100%; }
        #spinner-containner { margin-top: 5rem;display: none; height: 100%; width: 100%; background-color: rgba(255, 255, 255, .7); position: absolute;top:0; align-items: center; justify-content: center; }
        #spinner { display: inline-block; width: 50px; height: 50px; border: 6px solid var(--secondary-color); border-radius: 50%; border-top-color: var(--primary-color); animation: spin 1s ease-in-out infinite; -webkit-animation: spin 1s ease-in-out infinite; }
        #logo-container { display: flex; width: 100%; align-items: center; justify-content: center; flex-wrap: wrap; line-height: 2rem; margin-top: 2rem;}
        #savedURLContainer { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2rem; }
        .savedURL{ aspect-ratio: 1 / 1; min-width: 20%; max-width: 30%; border: 1px solid #CCC; background-color: #F5F5F5; border-radius: 5px; }
        .bg-secondary { background-color: var(--secondary-color); color: #333; }
        .bg-primary { background-color: var(--primary-color); color: #FFF; }
        .border-0 { border: none; outline: none; }
        .fw500 { font-weight: 500; }
        @keyframes spin { to { -webkit-transform: rotate(360deg); } }
        @-webkit-keyframes spin { to { -webkit-transform: rotate(360deg); } }

    .contenedor {
      display: flex;
      justify-content: center;     /* Centrado horizontal */
      align-items: center;         /* Centrado vertical */
      height: 100vh;               /* Ocupa toda la altura de la ventana */
    }
    </style>

            function browserHandler(protocolId, urlId, btnId){
                const btn = document.getElementById(btnId);
                const inpt = document.getElementById(urlId);
                const prot = document.getElementById(protocolId);

                if(btn) btn.addEventListener('click', e => {
                    navigateURL(inpt, prot);
                });
                if(inpt)inpt.addEventListener("search", e => {
                    navigateURL(inpt, prot);
                });
            }

            function navigateURL(url, prot)
            {
                try
                {
                    if(!url.value && !url.value.trim())
                    {
                        url.focus();
                        return;
                    }
                    let location = prot.value.trim() + url.value.trim();

                    localStorage.setItem("last_url",url.value.trim());
                    document.getElementById("spinner-containner").style.display="flex";
                    window.location.href = location;
                }
                catch(e)
                {
                    document.getElementById("spinner-containner").style.display="none";
                    alert(e.message ?? e);
                }
            }

            browserHandler("protocol-select-browser", "url-browser", "navigate-btn-browser");
        });
    </script>
</body>
</html>
